name: rtk-required

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rtk-required:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run maintained RTK graph
        run: npm run -s test:rtk

      - name: Run R2.4 E0 runner safety quarantine gate
        run: npm run -s test:r24-e0

      - name: Run R2.4 Q0 toolchain hygiene gate
        run: npm run -s test:r24-q0

      - name: Run R2.4 P0 autosave generation gate
        run: npm run -s test:r24-p0

      - name: Run R2.4 S0 IPC caller identity gate
        run: npm run -s test:r24-s0

      - name: Run R2.4 P1 dirty admission ack gate
        run: npm run -s test:r24-p1

      - name: Run R2.4 S1 IPC envelope budgets gate
        run: npm run -s test:r24-s1

      - name: Run R2.4 K0 command protocol gate
        run: npm run -s test:r24-k0

      - name: Run R2.4 R0 revision algebra gate
        run: npm run -s test:r24-r0

      - name: Run R2.4 P2 durable save coordinator gate
        run: npm run -s test:r24-p2

      - name: Run R2.4 R1 shadow authority cell gate
        run: npm run -s test:r24-r1

      - name: Run R2.4 P3 transactional project commit gate
        run: npm run -s test:r24-p3

      - name: Run R2.4 T0 text coordinate algebra gate
        run: npm run -s test:r24-t0

      - name: Run R2.4 SEC0 path capability gate
        run: npm run -s test:r24-sec0

      - name: Run R2.4 ENT0 entitlement conformance gate
        run: npm run -s test:r24-ent0

      - name: Run R2.4 K1 authority decomposition gate
        run: npm run -s test:r24-k1

      - name: Run R2.4 T1 anchor lineage gate
        run: npm run -s test:r24-t1

      - name: Run R2.4 WP-100 generation admission gate
        run: npm run -s test:r24-wp100

      - name: Run R2.4 WP-101 IPC admission gate
        run: npm run -s test:r24-wp101

      - name: Run R2.4 WP-102 operation protocol gate
        run: npm run -s test:r24-wp102

      - name: Run R2.4 WP-103 revision product order gate
        run: npm run -s test:r24-wp103

      - name: Run R2.4 WP-104 boundary falsification gate
        run: npm run -s test:r24-wp104

      - name: Run R2.4 R2 storage bakeoff gate
        run: npm run -s test:r24-r2

      - name: Run R2.4 R3 recovery ledger gate
        run: npm run -s test:r24-r3

      - name: Run R2.4 R4 transactional inbox/outbox gate
        run: npm run -s test:r24-r4

      - name: Run R2.4 R5 lifecycle external conflict gate
        run: npm run -s test:r24-r5

      - name: Run R2.4 R6 migration history backup GC gate
        run: npm run -s test:r24-r6

      - name: Run R2.4 F0 writer refinement conformance gate
        run: npm run -s test:r24-f0

      - name: Run R2.4 V0 Writer claim compiler gate
        run: npm run -s test:r24-v0

      - name: Run R2.4 A0 Atlas incremental equivalence gate
        run: npm run -s test:r24-a0

      - name: Run R2.4 V1 Atlas claim compiler gate
        run: npm run -s test:r24-v1

      - name: Run R2.4 A1 optional relation vocabulary gate
        run: npm run -s test:r24-a1

      - name: Run R2.4 PK0 package content trust gate
        run: npm run -s test:r24-pk0

      - name: Run R2.4 PK1 release security physical gate
        run: npm run -s test:r24-pk1

      - name: Run maintained Atlas event contract graph
        run: npm run -s test:atlas-event-contract

      - name: Run maintained Atlas release truth graph
        run: npm run -s test:atlas-release-truth

      - name: Run Atlas V6 production evidence coverage guard
        run: npm run -s test:atlas-v6-production-coverage

      - name: Run Atlas V6 production negative matrix
        run: npm run -s test:atlas-v6-production
