name: r24-terminal-attestation

on:
  workflow_dispatch:
    inputs:
      stage_id: { required: true, type: string }
      stage_instance_path: { required: true, type: string }
      stage_admission_path: { required: true, type: string }
      requirements_path: { required: true, type: string }
      program_template_digest: { required: true, type: string }
      stage_instance_digest: { required: true, type: string }
      stage_admission_digest: { required: true, type: string }
      acceptance_signals_digest: { required: false, type: string }
      implementation_candidate_sha: { required: true, type: string }
      implementation_merge_sha: { required: true, type: string }
      evaluation_sha: { required: true, type: string }
      evaluation_tree_sha: { required: true, type: string }

permissions:
  actions: read
  contents: read

concurrency:
  group: r24-terminal-attestation-${{ inputs.stage_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: 20.19.5
  EVALUATION_SHA: ${{ inputs.evaluation_sha }}
  EVALUATION_TREE_SHA: ${{ inputs.evaluation_tree_sha }}
  GOVERNANCE_CHANGE_APPROVALS_PATH: docs/OPS/R24/CORRECTIVE/C1C_GOVERNANCE_CHANGE_APPROVALS_V1.json

jobs:
  stage-router:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsupported or cross-stage dispatch
        shell: bash
        env:
          STAGE_ID: ${{ inputs.stage_id }}
        run: |
          set -euo pipefail
          case "${STAGE_ID}" in
            AUDIT_R2_COMPLETE_CHAIN|WP-400_ANCHOR_LINEAGE) ;;
            *) echo "E_STAGE_IDENTITY:${STAGE_ID}" >&2; exit 1 ;;
          esac

  linux-evidence:
    needs: stage-router
    if: ${{ inputs.stage_id == 'AUDIT_R2_COMPLETE_CHAIN' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evaluation_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Bind exact protected merge identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "${EVALUATION_SHA}"
          test "$(git rev-parse HEAD)" = "${EVALUATION_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${EVALUATION_TREE_SHA}"
          test "${{ inputs.stage_id }}" = AUDIT_R2_COMPLETE_CHAIN
          test "${{ inputs.program_template_digest }}" = 6c833c964318da3e61e1743365f8763206be838647b5222c187b3bda8d1c6b9a
          test "${{ inputs.implementation_merge_sha }}" = "${EVALUATION_SHA}"
          test "$(git rev-parse '${{ inputs.implementation_merge_sha }}^2')" = "${{ inputs.implementation_candidate_sha }}"
          test "$(git rev-parse '${{ inputs.implementation_candidate_sha }}^{tree}')" = "${EVALUATION_TREE_SHA}"
          test "${{ inputs.stage_instance_path }}" = docs/OPS/R24/CORRECTIVE/AUDIT_R2_FINAL_CORRECTION_STAGE_INSTANCE_V1.json
          test "${{ inputs.stage_admission_path }}" = docs/OPS/R24/CORRECTIVE/AUDIT_R2_FINAL_CORRECTION_STAGE_ADMISSION_ATTESTATION_V1.json
          test "${{ inputs.requirements_path }}" = docs/OPS/R24/CORRECTIVE/AUDIT_R2_ACCEPTANCE_REQUIREMENTS_V1.json
          test "$(sha256sum '${{ inputs.stage_instance_path }}' | cut -d ' ' -f 1)" = "${{ inputs.stage_instance_digest }}"
          test "$(sha256sum '${{ inputs.stage_admission_path }}' | cut -d ' ' -f 1)" = "${{ inputs.stage_admission_digest }}"
      - name: Execute Linux control and baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          R="${RUNNER_TEMP}/results"
          mkdir -p "${R}"
          make_result() {
            RESULT_ID="$1" RESULT_SOURCE="$2" RESULT_PROGRAM="$3" RESULT_ARGS_JSON="$4" RESULT_LOG="$5" RESULT_ENV_JSON="${6-}" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { canonicalBytes } from './scripts/ops/r24/corrective/canonical-json.mjs';
          const h=(bytes)=>crypto.createHash('sha256').update(bytes).digest('hex');
          const environment=JSON.parse(process.env.RESULT_ENV_JSON || '{}');const command={program:process.env.RESULT_PROGRAM,args:JSON.parse(process.env.RESULT_ARGS_JSON),...(Object.keys(environment).length>0?{environment}:{})};
          const evidencePath='evidence-'+process.env.RESULT_ID.toLowerCase()+'.log';
          const evidence=fs.readFileSync(process.env.RESULT_LOG);
          fs.copyFileSync(process.env.RESULT_LOG,process.env.RUNNER_TEMP+'/results/'+evidencePath);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/results/result-'+process.env.RESULT_ID+'.json',canonicalBytes({id:process.env.RESULT_ID,status:'PASS',exitCode:0,command,commandDigest:h(canonicalBytes(command)),evidencePath,evidenceDigest:h(evidence),evaluationSha:process.env.EVALUATION_SHA,evaluationTreeSha:process.env.EVALUATION_TREE_SHA,source:process.env.RESULT_SOURCE}));
          NODE
          }
          node scripts/ops/r24/corrective/audit-r2-stage-admission-verifier.mjs \
            --instance "${{ inputs.stage_instance_path }}" \
            --contract docs/OPS/R24/CORRECTIVE/AUDIT_R2_FINAL_CORRECTION_CONTRACT_V1.json \
            --verifier-contract docs/OPS/R24/CORRECTIVE/AUDIT_R2_STAGE_ADMISSION_VERIFIER_CONTRACT_V1.json \
            --amendment docs/OPS/R24/CORRECTIVE/AUDIT_R2_PROGRAM_RATIFICATION_AMENDMENT_V1.json \
            --registry docs/OPS/R24/CORRECTIVE/STAGE_REGISTRY_V1.json \
            --program docs/OPS/R24/CORRECTIVE/PROGRAM_TEMPLATE_V1_1.json \
            2>&1 | tee "${RUNNER_TEMP}/successor-admission.log"
          cmp "${RUNNER_TEMP}/successor-admission.log" "${{ inputs.stage_admission_path }}"
          make_result SUCCESSOR_ADMISSION CONTROL_PLANE_VERIFIER node '["audit-r2-stage-admission-verifier"]' "${RUNNER_TEMP}/successor-admission.log"
          node scripts/ops/r24/corrective/audit-r2-lease-verifier.mjs --check-active docs/OPS/R24/CORRECTIVE/AUDIT_R2_LEASE_FENCE_LEDGER_V1.json 2>&1 | tee "${RUNNER_TEMP}/lease.log"
          make_result LEASE_FENCE_ACTIVE CONTROL_PLANE_VERIFIER node '["audit-r2-lease-verifier","--check-active"]' "${RUNNER_TEMP}/lease.log"
          {
            node scripts/ops/r24/corrective/audit-r2-corrections.mjs --check
            node --test \
              test/contracts/r24-audit-r2-corrections.contract.test.mjs \
              test/contracts/r24-audit-r2-lease-verifier.contract.test.mjs \
              test/contracts/r24-audit-r2-physical-evidence.contract.test.mjs \
              test/contracts/r24-audit-r2-stage-admission-verifier.contract.test.mjs \
              test/contracts/r24-audit-r2-stage-replay.contract.test.mjs \
              test/contracts/r24-audit-r2-terminal-attestation.contract.test.mjs
          } 2>&1 | tee "${RUNNER_TEMP}/contracts.log"
          make_result CORRECTED_CONTRACTS GITHUB_ACTIONS_JOB node '["--test","audit-r2-contracts"]' "${RUNNER_TEMP}/contracts.log"
          npm test 2>&1 | tee "${RUNNER_TEMP}/full-baseline.log"
          make_result FULL_BASELINE GITHUB_ACTIONS_JOB npm '["test"]' "${RUNNER_TEMP}/full-baseline.log"
          SECTOR_U_FULL_A11Y=1 SECTOR_U_FULL_VISUAL=1 SECTOR_U_FULL_PERF=1 npm run test:sector-u-full 2>&1 | tee "${RUNNER_TEMP}/sector-u.log"
          RESULT_LOG="${RUNNER_TEMP}/sector-u.log" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import { parseTap } from './scripts/ops/r24/corrective/audit-r2-stage-replay.mjs';
          parseTap(fs.readFileSync(process.env.RESULT_LOG),'SECTOR_U_FULL');
          NODE
          make_result SECTOR_U_FULL GITHUB_ACTIONS_JOB npm '["run","test:sector-u-full"]' "${RUNNER_TEMP}/sector-u.log" '{"SECTOR_U_FULL_A11Y":"1","SECTOR_U_FULL_PERF":"1","SECTOR_U_FULL_VISUAL":"1"}'
          {
            npm run agent:bootstrap -- --objective audit-r2-post-merge-terminal-attestation
            npm run agent:guardrails
            git diff --check
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          } 2>&1 | tee "${RUNNER_TEMP}/guardrails.log"
          make_result GUARDRAILS GITHUB_ACTIONS_JOB npm '["run","agent:guardrails"]' "${RUNNER_TEMP}/guardrails.log"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-r2-results-linux
          path: ${{ runner.temp }}/results/*
          if-no-files-found: error

  macos-evidence:
    needs: stage-router
    if: ${{ inputs.stage_id == 'AUDIT_R2_COMPLETE_CHAIN' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evaluation_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prepare same-run physical macOS, DOCX, unsigned artifact, and package evidence
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          P="${RUNNER_TEMP}/physical"
          mkdir -p "${P}/docx/_rels" "${P}/docx/word" "${RUNNER_TEMP}/results"
          npm run build:renderer
          npm run test:electron 2>&1 | tee "${P}/physical.log"
          {
            npm run test:r24-w0
            npm run test:r24-pk1
            npm run test:r24-v3
            npx electron-builder --mac --dir --publish never
          } 2>&1 | tee "${P}/platform.log"
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>' > "${P}/docx/[Content_Types].xml"
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>' > "${P}/docx/_rels/.rels"
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>Yalken synthetic audit R2 document</w:t></w:r></w:p></w:body></w:document>' > "${P}/docx/word/document.xml"
          (cd "${P}/docx" && zip -X -q -r "${P}/synthetic-audit-r2.docx" .)
          APP_PATH="$(find dist -maxdepth 3 -type d -name 'Yalken.app' -print -quit)"
          test -n "${APP_PATH}"
          ditto -c -k --keepParent "${APP_PATH}" "${P}/unsigned-yalken-app.zip"
          node scripts/ops/r24/corrective/audit-r2-physical-evidence.mjs \
            --compile --root "${P}" \
            --evaluation-sha "${EVALUATION_SHA}" --evaluation-tree "${EVALUATION_TREE_SHA}" \
            --docx synthetic-audit-r2.docx --artifact unsigned-yalken-app.zip \
            --log PHYSICAL_A11Y_PERFORMANCE=physical.log \
            --log PLATFORM_COMPLEMENTS=platform.log \
            --write "${P}/physical-manifest.json"
      - name: Execute stage-specific 33-stage replay
        id: stage_replay
        shell: bash
        env:
          AUDIT_R2_PHYSICAL_ROOT: ${{ runner.temp }}/physical
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EVALUATION_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${EVALUATION_TREE_SHA}"
          C8D_LOCK_DIR="/private/tmp/yalken-r24-corrective-canonical-writer.lock"
          C8D_LEASE_CARRIER="docs/OPS/R24/CORRECTIVE/AUDIT_R2_C8D_LEASE_CARRIER_V1.json"
          C8D_FENCE_CARRIER="docs/OPS/R24/CORRECTIVE/AUDIT_R2_C8D_FENCE_CARRIER_V1.json"
          C8D_LEASE_TARGET="${C8D_LOCK_DIR}/lease-c8d-pk1-security-package-v1.json"
          C8D_FENCE_TARGET="${C8D_LOCK_DIR}/fence-c8d-pk1-security-package-v1.json"
          test "$(shasum -a 256 "${C8D_LEASE_CARRIER}" | awk '{print $1}')" = a628943f000979a32186c1934c560c8fa25cc1b327c01e44382b7e531c5cfc0c
          test "$(shasum -a 256 "${C8D_FENCE_CARRIER}" | awk '{print $1}')" = a2cc34a9e3f998e1e1b3e3c16cebd8b04f88fe5930eb9982770adcc18fbbf043
          mkdir -p "${C8D_LOCK_DIR}"
          if [ -e "${C8D_LEASE_TARGET}" ]; then cmp "${C8D_LEASE_CARRIER}" "${C8D_LEASE_TARGET}"; else cp "${C8D_LEASE_CARRIER}" "${C8D_LEASE_TARGET}"; fi
          if [ -e "${C8D_FENCE_TARGET}" ]; then cmp "${C8D_FENCE_CARRIER}" "${C8D_FENCE_TARGET}"; else cp "${C8D_FENCE_CARRIER}" "${C8D_FENCE_TARGET}"; fi
          test "$(shasum -a 256 "${C8D_LEASE_TARGET}" | awk '{print $1}')" = a628943f000979a32186c1934c560c8fa25cc1b327c01e44382b7e531c5cfc0c
          test "$(shasum -a 256 "${C8D_FENCE_TARGET}" | awk '{print $1}')" = a2cc34a9e3f998e1e1b3e3c16cebd8b04f88fe5930eb9982770adcc18fbbf043
          mkdir -p "${RUNNER_TEMP}/results" "${RUNNER_TEMP}/replay"
          node scripts/ops/r24/corrective/audit-r2-stage-replay.mjs \
            --execute docs/OPS/R24/CORRECTIVE/AUDIT_R2_STAGE_REPLAY_PLAN_V1.json \
            --evaluation-sha "${EVALUATION_SHA}" \
            --evaluation-tree "${EVALUATION_TREE_SHA}" \
            --output-dir "${RUNNER_TEMP}/replay" \
            2>&1 | tee "${RUNNER_TEMP}/stage-replay.log"
          RESULT_LOG="${RUNNER_TEMP}/stage-replay.log" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto'; import { canonicalBytes } from './scripts/ops/r24/corrective/canonical-json.mjs';
          const h=(b)=>crypto.createHash('sha256').update(b).digest('hex'); const command={program:'node',args:['audit-r2-stage-replay','--execute']}; const evidencePath='evidence-stage_replay_33.log'; const evidence=fs.readFileSync(process.env.RESULT_LOG); fs.copyFileSync(process.env.RESULT_LOG,process.env.RUNNER_TEMP+'/results/'+evidencePath); fs.writeFileSync(process.env.RUNNER_TEMP+'/results/result-STAGE_REPLAY_33.json',canonicalBytes({id:'STAGE_REPLAY_33',status:'PASS',exitCode:0,command,commandDigest:h(canonicalBytes(command)),evidencePath,evidenceDigest:h(evidence),evaluationSha:process.env.EVALUATION_SHA,evaluationTreeSha:process.env.EVALUATION_TREE_SHA,source:'GITHUB_ACTIONS_JOB'}));
          NODE
      - name: Upload fail-closed sanitized stage replay diagnostics
        if: ${{ always() && steps.stage_replay.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-r2-stage-replay-diagnostics-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/replay/*-failure-sanitized.log
            ${{ runner.temp }}/replay/*-failure.json
          if-no-files-found: error
          retention-days: 90
      - name: Record same-run physical lane acceptance results
        shell: bash
        run: |
          set -euo pipefail
          P="${RUNNER_TEMP}/physical"
          for ID in PHYSICAL_MACOS PLATFORM_COMPLEMENTS; do
            if [ "${ID}" = PHYSICAL_MACOS ]; then LOG="${P}/physical.log"; else LOG="${P}/platform.log"; fi
            RESULT_ID="${ID}" RESULT_LOG="${LOG}" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto'; import { canonicalBytes } from './scripts/ops/r24/corrective/canonical-json.mjs';
          const h=(b)=>crypto.createHash('sha256').update(b).digest('hex'); const command={program:'node',args:['audit-r2-physical-evidence',process.env.RESULT_ID]}; const evidencePath='evidence-'+process.env.RESULT_ID.toLowerCase()+'.log'; const evidence=fs.readFileSync(process.env.RESULT_LOG); fs.copyFileSync(process.env.RESULT_LOG,process.env.RUNNER_TEMP+'/results/'+evidencePath); fs.writeFileSync(process.env.RUNNER_TEMP+'/results/result-'+process.env.RESULT_ID+'.json',canonicalBytes({id:process.env.RESULT_ID,status:'PASS',exitCode:0,command,commandDigest:h(canonicalBytes(command)),evidencePath,evidenceDigest:h(evidence),evaluationSha:process.env.EVALUATION_SHA,evaluationTreeSha:process.env.EVALUATION_TREE_SHA,source:'MACOS_PHYSICAL_JOB'}));
          NODE
          done
      - uses: actions/upload-artifact@v4
        with:
          name: audit-r2-results-macos
          path: |
            ${{ runner.temp }}/results/*
            ${{ runner.temp }}/replay/**
            ${{ runner.temp }}/physical/physical-manifest.json
            ${{ runner.temp }}/physical/synthetic-audit-r2.docx
            ${{ runner.temp }}/physical/unsigned-yalken-app.zip
            ${{ runner.temp }}/physical/physical.log
            ${{ runner.temp }}/physical/platform.log
          if-no-files-found: error

  terminal:
    needs: [stage-router, linux-evidence, macos-evidence]
    if: ${{ inputs.stage_id == 'AUDIT_R2_COMPLETE_CHAIN' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evaluation_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download exact same-run immutable evidence artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/collected/linux" "${RUNNER_TEMP}/collected/macos"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" > "${RUNNER_TEMP}/artifacts.json"
          for SPEC in "audit-r2-results-linux:linux" "audit-r2-results-macos:macos"; do
            NAME="${SPEC%%:*}"
            DIR="${SPEC##*:}"
            ID="$(jq -er --arg name "${NAME}" '.artifacts | map(select(.name == $name and .expired == false)) | if length == 1 then .[0].id else error("artifact cardinality") end' "${RUNNER_TEMP}/artifacts.json")"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > "${RUNNER_TEMP}/${DIR}.zip"
            unzip -q "${RUNNER_TEMP}/${DIR}.zip" -d "${RUNNER_TEMP}/collected/${DIR}"
          done
      - name: Compile fail-closed acceptance bundle, release, receipt, manifest and envelope
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/terminal"
          mkdir -p "${OUT}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path'; import crypto from 'node:crypto';
          import { canonicalBytes } from './scripts/ops/r24/corrective/canonical-json.mjs';
          import { validateLedger } from './scripts/ops/r24/corrective/audit-r2-lease-verifier.mjs';
          const h=(b)=>crypto.createHash('sha256').update(b).digest('hex');
          const collected=path.join(process.env.RUNNER_TEMP,'collected'); const out=path.join(process.env.RUNNER_TEMP,'terminal');
          const allFiles=(dir)=>fs.readdirSync(dir,{withFileTypes:true}).flatMap((entry)=>entry.isDirectory()?allFiles(path.join(dir,entry.name)):[path.join(dir,entry.name)]);
          const collectedFiles=allFiles(collected); const byBase=new Map(); for(const file of collectedFiles){if(file.includes('/stage-inputs/'))continue;const name=path.basename(file);if(byBase.has(name))throw new Error('E_DUPLICATE_BASENAME:'+name);byBase.set(name,file);}
          const required=JSON.parse(fs.readFileSync('docs/OPS/R24/CORRECTIVE/AUDIT_R2_ACCEPTANCE_REQUIREMENTS_V1.json'));
          const results=[...byBase.entries()].filter(([name])=>/^result-.*\.json$/u.test(name)).sort(([left],[right])=>left.localeCompare(right)).map(([,file])=>JSON.parse(fs.readFileSync(file)));
          const expectedWithoutRelease=required.requiredOutcomeIds.filter((id)=>id!=='FINAL_RELEASE').sort();
          if(JSON.stringify(results.map((item)=>item.id).sort())!==JSON.stringify(expectedWithoutRelease)) throw new Error('E_RESULT_SET');
          for(const result of results){if(result.status!=='PASS'||result.exitCode!==0||result.evaluationSha!==process.env.EVALUATION_SHA||result.evaluationTreeSha!==process.env.EVALUATION_TREE_SHA)throw new Error('E_RESULT:'+result.id);const source=byBase.get(result.evidencePath);if(!source||h(fs.readFileSync(source))!==result.evidenceDigest)throw new Error('E_EVIDENCE:'+result.id);fs.copyFileSync(source,path.join(out,result.evidencePath));}
          const ledger=JSON.parse(fs.readFileSync('docs/OPS/R24/CORRECTIVE/AUDIT_R2_LEASE_FENCE_LEDGER_V1.json'));
          const acquire=ledger.events.find((item)=>item.payload.eventType==='LEASE_ACQUIRE'); const fence=ledger.events.find((item)=>item.payload.eventType==='FENCE_ADVANCE');
          const releasePayload={schemaVersion:'AUDIT_R2_LEASE_EVENT_V1',eventType:'RELEASE',authority:'AUDIT_ROUND_2_FINAL_CORRECTION_BRIEF',writerTaskId:'01a04c8d-a686-7a43-b378-1af1eebc5fbb',fencingCounter:54,leaseAcquisitionEventDigest:acquire.digest,fenceEventDigest:fence.digest,status:'RELEASED',wip:0,unpreservedWip:0,releaseReason:'PROTECTED_MERGE_POST_MERGE_CI_AND_TERMINAL_ACCEPTANCE_COMPLETE',programDoneClaimed:false,wp400MutationStarted:false,observedAtUtc:new Date().toISOString()};
          const release={payload:releasePayload,digest:h(canonicalBytes(releasePayload))}; ledger.events.push(release); ledger.effectiveState.status='RELEASED'; ledger.effectiveState.wip=0;
          validateLedger(ledger,{root:process.cwd(),requireReleased:true});
          const releaseBytes=canonicalBytes(ledger);fs.writeFileSync(path.join(out,'lease-release-ledger.json'),releaseBytes);
          const releaseLog=Buffer.from('release '+release.digest+' wip 0\n');fs.writeFileSync(path.join(out,'evidence-final_release.log'),releaseLog);
          const releaseCommand={program:'node',args:['audit-r2-lease-verifier','--check-release']};
          results.push({id:'FINAL_RELEASE',status:'PASS',exitCode:0,command:releaseCommand,commandDigest:h(canonicalBytes(releaseCommand)),evidencePath:'evidence-final_release.log',evidenceDigest:h(releaseLog),evaluationSha:process.env.EVALUATION_SHA,evaluationTreeSha:process.env.EVALUATION_TREE_SHA,source:'CONTROL_PLANE_VERIFIER'});
          const stageSource=byBase.get('stage-replay-manifest.json'); const physicalSource=byBase.get('physical-manifest.json');
          if(!stageSource||!physicalSource)throw new Error('E_MANIFEST_DISCOVERY');
          const stageBytes=fs.readFileSync(stageSource); const physicalBytes=fs.readFileSync(physicalSource);
          fs.copyFileSync(stageSource,path.join(out,'stage-replay-manifest.json')); fs.copyFileSync(physicalSource,path.join(out,'physical-manifest.json'));
          for(const file of collectedFiles.filter((item)=>item.includes('/stage-inputs/'))){const relative=file.slice(file.indexOf('/stage-inputs/')+1);const destination=path.join(out,relative);fs.mkdirSync(path.dirname(destination),{recursive:true});fs.copyFileSync(file,destination);}
          for(const [name,file] of byBase.entries()) if(/^stage-.*\.(?:json|log)$/u.test(name)) fs.copyFileSync(file,path.join(out,name));
          for(const name of ['synthetic-audit-r2.docx','unsigned-yalken-app.zip','physical.log','platform.log']){const file=byBase.get(name);if(!file)throw new Error('E_PHYSICAL_FILE:'+name);fs.copyFileSync(file,path.join(out,name));}
          const bundle={schemaVersion:'AUDIT_R2_ACCEPTANCE_RESULT_BUNDLE_V1',bundleId:required.bundleId,evaluationSha:process.env.EVALUATION_SHA,evaluationTreeSha:process.env.EVALUATION_TREE_SHA,requirementsDigest:h(fs.readFileSync('docs/OPS/R24/CORRECTIVE/AUDIT_R2_ACCEPTANCE_REQUIREMENTS_V1.json')),results:required.requiredOutcomeIds.map((id)=>results.find((item)=>item.id===id)),stageReplayManifestDigest:h(stageBytes),physicalManifestDigest:h(physicalBytes),leaseReleaseDigest:release.digest,status:'PASS',programDoneClaimed:false,wp400MutationStarted:false};
          const bundleBytes=canonicalBytes(bundle);fs.writeFileSync(path.join(out,'acceptance-bundle.json'),bundleBytes);
          const receipt={schemaVersion:'AUDIT_R2_FINAL_CORRECTION_RECEIPT_V1',evaluationSha:process.env.EVALUATION_SHA,evaluationTreeSha:process.env.EVALUATION_TREE_SHA,acceptanceBundleDigest:h(bundleBytes),stageReplayManifestDigest:h(stageBytes),physicalManifestDigest:h(physicalBytes),leaseReleaseDigest:release.digest,findingClosures:['R24-R2-001','R24-R2-002','R24-R2-003','R24-R2-004','R24-R2-005','R24-R2-006','R24-R2-007','R24-R2-008'],stageReplayPassCount:33,requiredSkips:0,unexplainedSkips:0,programDoneClaimed:false,wp400MutationStarted:false};
          const receiptBytes=canonicalBytes(receipt);fs.writeFileSync(path.join(out,'final-correction-receipt.json'),receiptBytes);
          const walk=(dir,prefix='')=>fs.readdirSync(dir,{withFileTypes:true}).flatMap((entry)=>entry.isDirectory()?walk(path.join(dir,entry.name),prefix+entry.name+'/'):[prefix+entry.name]);
          const manifest={schemaVersion:'AUDIT_R2_ARTIFACT_MANIFEST_V1',evaluationSha:process.env.EVALUATION_SHA,evaluationTreeSha:process.env.EVALUATION_TREE_SHA,entries:walk(out).sort().map((name)=>{const bytes=fs.readFileSync(path.join(out,name));return{path:name,sha256:h(bytes),sizeBytes:bytes.length};})};
          const manifestBytes=canonicalBytes(manifest);fs.writeFileSync(path.join(out,'artifact-manifest.json'),manifestBytes);
          const envelope={schemaVersion:'AUDIT_R2_TERMINAL_ATTESTATION_V1',status:'PASS',evaluationSha:process.env.EVALUATION_SHA,evaluationTreeSha:process.env.EVALUATION_TREE_SHA,acceptanceBundleDigest:h(bundleBytes),artifactManifestDigest:h(manifestBytes),finalReceiptDigest:h(receiptBytes),stageReplayManifestDigest:h(stageBytes),physicalManifestDigest:h(physicalBytes),leaseReleaseDigest:release.digest,programDoneClaimed:false,wp400MutationStarted:false};
          fs.writeFileSync(path.join(out,'terminal-envelope.json'),canonicalBytes(envelope));
          NODE
          (cd "${OUT}" && zip -X -q -r "${RUNNER_TEMP}/local-terminal.zip" .)
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto'; import { verifyDownloadedArtifact } from './scripts/ops/r24/corrective/audit-r2-terminal-attestation-verifier.mjs'; import { canonicalBytes } from './scripts/ops/r24/corrective/canonical-json.mjs';
          const bytes=fs.readFileSync(process.env.RUNNER_TEMP+'/local-terminal.zip');const digest=crypto.createHash('sha256').update(bytes).digest('hex');const runId=String(process.env.GITHUB_RUN_ID);const name='audit-r2-terminal-'+runId;const result=verifyDownloadedArtifact({zipBytes:bytes,metadata:{artifactId:'LOCAL_PREUPLOAD',artifactName:name,expired:false,runConclusion:'success',runHeadSha:process.env.EVALUATION_SHA,runId},expected:{artifactId:'LOCAL_PREUPLOAD',artifactName:name,runId,zipDigest:digest,evaluationSha:process.env.EVALUATION_SHA,evaluationTreeSha:process.env.EVALUATION_TREE_SHA}});fs.writeFileSync(process.env.RUNNER_TEMP+'/local-preupload-verification.json',canonicalBytes(result));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: audit-r2-terminal-${{ github.run_id }}
          path: ${{ runner.temp }}/terminal/*
          if-no-files-found: error
          retention-days: 90

  wp400-terminal-attestation:
    needs: stage-router
    if: ${{ inputs.stage_id == 'WP-400_ANCHOR_LINEAGE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evaluation_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Verify exact WP-400 identities and admission
        shell: bash
        env:
          STAGE_ID: ${{ inputs.stage_id }}
          STAGE_INSTANCE_PATH: ${{ inputs.stage_instance_path }}
          STAGE_ADMISSION_PATH: ${{ inputs.stage_admission_path }}
          REQUIREMENTS_PATH: ${{ inputs.requirements_path }}
          PROGRAM_TEMPLATE_DIGEST: ${{ inputs.program_template_digest }}
          STAGE_INSTANCE_DIGEST: ${{ inputs.stage_instance_digest }}
          STAGE_ADMISSION_DIGEST: ${{ inputs.stage_admission_digest }}
          ACCEPTANCE_SIGNALS_DIGEST: ${{ inputs.acceptance_signals_digest }}
          IMPLEMENTATION_CANDIDATE_SHA: ${{ inputs.implementation_candidate_sha }}
          IMPLEMENTATION_MERGE_SHA: ${{ inputs.implementation_merge_sha }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit 1; }
          test "${GITHUB_REF}" = "refs/heads/main" || fail E_REF_IDENTITY
          test "${GITHUB_SHA}" = "${EVALUATION_SHA}" || fail E_EVALUATION_SHA_MISMATCH
          test "$(git rev-parse HEAD^{tree})" = "${EVALUATION_TREE_SHA}" || fail E_EVALUATION_TREE_MISMATCH
          test "${STAGE_ID}" = "WP-400_ANCHOR_LINEAGE" || fail E_STAGE_IDENTITY
          test "${STAGE_INSTANCE_PATH}" = "docs/OPS/R24/CORRECTIVE/WP400_TERMINAL_ISSUER_COMPATIBILITY_STAGE_INSTANCE_V1.json" || fail E_STAGE_PATH_IDENTITY
          test "${STAGE_ADMISSION_PATH}" = "docs/OPS/R24/CORRECTIVE/WP400_TERMINAL_ISSUER_COMPATIBILITY_STAGE_ADMISSION_ATTESTATION_V1.json" || fail E_STAGE_PATH_IDENTITY
          test "${REQUIREMENTS_PATH}" = "docs/OPS/R24/CORRECTIVE/WP400_TERMINAL_ISSUER_COMPATIBILITY_EXACT_HEAD_AMENDMENT_V1.json" || fail E_STAGE_PATH_VERSION_MISMATCH
          test "$(sha256sum "${REQUIREMENTS_PATH}" | cut -d ' ' -f 1)" = "${PROGRAM_TEMPLATE_DIGEST}" || fail E_PROGRAM_DIGEST_MISMATCH
          test "$(sha256sum "${STAGE_INSTANCE_PATH}" | cut -d ' ' -f 1)" = "${STAGE_INSTANCE_DIGEST}" || fail E_STAGE_DIGEST_MISMATCH
          test "$(sha256sum "${STAGE_ADMISSION_PATH}" | cut -d ' ' -f 1)" = "${STAGE_ADMISSION_DIGEST}" || fail E_STAGE_DIGEST_MISMATCH
          git merge-base --is-ancestor "${IMPLEMENTATION_CANDIDATE_SHA}" "${IMPLEMENTATION_MERGE_SHA}" || fail E_IMPLEMENTATION_ANCESTRY
          git merge-base --is-ancestor "${IMPLEMENTATION_MERGE_SHA}" "${EVALUATION_SHA}" || fail E_EVALUATION_ANCESTRY
          node scripts/ops/r24/corrective/stage-admission-verifier.mjs \
            "${STAGE_INSTANCE_PATH}" \
            docs/OPS/R24/CORRECTIVE/WP400_TERMINAL_ISSUER_COMPATIBILITY_STAGE_REGISTRY_V1.json \
            "${REQUIREMENTS_PATH}" > "${RUNNER_TEMP}/wp400-stage-admission.json"
          cmp "${RUNNER_TEMP}/wp400-stage-admission.json" "${STAGE_ADMISSION_PATH}" || fail E_ADMISSION_BINDING
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { canonicalBytes, sha256 } from "./scripts/ops/r24/corrective/canonical-json.mjs";
          const instanceBytes = readFileSync(process.env.STAGE_INSTANCE_PATH);
          const admissionBytes = readFileSync(process.env.STAGE_ADMISSION_PATH);
          const instance = JSON.parse(instanceBytes);
          const admission = JSON.parse(admissionBytes);
          if (!instanceBytes.equals(canonicalBytes(instance)) || !admissionBytes.equals(canonicalBytes(admission))) throw new Error("E_NON_CANONICAL_STAGE_BYTES");
          if (instance.stageId !== process.env.STAGE_ID || admission.stageId !== process.env.STAGE_ID) throw new Error("E_STAGE_IDENTITY");
          if (instance.programTemplateDigest !== process.env.PROGRAM_TEMPLATE_DIGEST || admission.programTemplateDigest !== process.env.PROGRAM_TEMPLATE_DIGEST) throw new Error("E_PROGRAM_DIGEST_MISMATCH");
          if (admission.stageInstanceDigest !== process.env.STAGE_INSTANCE_DIGEST || admission.acceptanceSignalsDigest !== process.env.ACCEPTANCE_SIGNALS_DIGEST || admission.status !== "ADMITTED") throw new Error("E_ADMISSION_BINDING");
          if (sha256(instanceBytes) !== process.env.STAGE_INSTANCE_DIGEST || sha256(admissionBytes) !== process.env.STAGE_ADMISSION_DIGEST) throw new Error("E_STAGE_DIGEST_MISMATCH");
          NODE
      - name: Execute exact-head WP-400 terminal gates
        shell: bash
        run: |
          set -euo pipefail
          node --test test/contracts/r24-terminal-attestation.contract.test.mjs test/unit/r24-wp400-anchor-lineage.test.js test/unit/r24-wp400-anchor-lineage-mutants.test.js
          node scripts/ops/r24/test-inventory.mjs --check docs/OPS/R24/CORRECTIVE/C1B_TEST_INVENTORY_V1.json
          node scripts/ops/r24/corrective/audit-r2-corrections.mjs --check
          npm run agent:guardrails
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Emit immutable WP-400 terminal envelope
        shell: bash
        env:
          STAGE_ID: ${{ inputs.stage_id }}
          PROGRAM_TEMPLATE_DIGEST: ${{ inputs.program_template_digest }}
          STAGE_INSTANCE_DIGEST: ${{ inputs.stage_instance_digest }}
          STAGE_ADMISSION_DIGEST: ${{ inputs.stage_admission_digest }}
          ACCEPTANCE_SIGNALS_DIGEST: ${{ inputs.acceptance_signals_digest }}
          IMPLEMENTATION_CANDIDATE_SHA: ${{ inputs.implementation_candidate_sha }}
          IMPLEMENTATION_MERGE_SHA: ${{ inputs.implementation_merge_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { canonicalBytes } from "./scripts/ops/r24/corrective/canonical-json.mjs";
          const attestation={schemaVersion:"TERMINAL_ATTESTATION_V1",attestationType:"EXTERNAL_IMMUTABLE_TERMINAL_ATTESTATION",result:"PASS",stageId:process.env.STAGE_ID,programTemplateDigest:process.env.PROGRAM_TEMPLATE_DIGEST,stageInstanceDigest:process.env.STAGE_INSTANCE_DIGEST,stageAdmissionAttestationDigest:process.env.STAGE_ADMISSION_DIGEST,acceptanceSignalsDigest:process.env.ACCEPTANCE_SIGNALS_DIGEST,implementationCandidateSha:process.env.IMPLEMENTATION_CANDIDATE_SHA,implementationMergeSha:process.env.IMPLEMENTATION_MERGE_SHA,evaluationSha:process.env.EVALUATION_SHA,evaluationTreeSha:process.env.EVALUATION_TREE_SHA,receiptCarrierSha:null,closureMergeSha:null,repository:process.env.GITHUB_REPOSITORY,workflowPath:".github/workflows/r24-terminal-attestation.yml",workflowRunId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),event:process.env.GITHUB_EVENT_NAME,ref:process.env.GITHUB_REF,createdAtUtc:new Date().toISOString(),externalImmutableTerminalAttestation:{provider:"GITHUB_ACTIONS_PROTECTED_WORKFLOW",workflowRunId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT)}};
          writeFileSync("terminal-attestation.json",canonicalBytes(attestation));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: r24-terminal-attestation-${{ inputs.stage_id }}
          path: terminal-attestation.json
          if-no-files-found: error
          retention-days: 90
