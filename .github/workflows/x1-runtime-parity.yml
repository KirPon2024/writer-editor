name: x1-runtime-parity

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x1-runtime-parity:
    name: x1-runtime-parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --engine-strict
      - name: Run X1 desktop parity harness
        shell: bash
        run: node scripts/ops/x1-desktop-parity-harness.mjs --json > parity-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ runner.os }}.json
          path: parity-report.json
          if-no-files-found: error
