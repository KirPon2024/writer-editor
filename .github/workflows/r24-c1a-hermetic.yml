name: r24-c1a-hermetic

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1a-hermetic:
    name: c1a-hermetic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact runtime before install
        shell: bash
        run: |
          test "$(node --version)" = "v22.12.0"
          test "$(npm --version)" = "10.9.0"
      - name: Clean exact engine-strict install
        run: npm ci --engine-strict
      - name: Verify successor toolchain and dependency graph
        run: node scripts/ops/r24/corrective/post-audit-toolchain.mjs
      - name: Build actual renderer and preload artifacts
        run: npm run build:renderer
      - name: Require deterministic tracked generated artifacts
        run: git diff --exit-code -- src/renderer/editor.bundle.js src/preload.bundle.cjs
      - name: Run focused post-audit contracts
        run: npm run test:r24-post-audit
      - name: Run Electron contract lanes
        run: npm run test:electron
      - name: Launch exact Electron binary on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --version
      - name: Launch exact Electron binary on macOS or Windows
        if: runner.os != 'Linux'
        run: npx electron --version
      - name: Verify dependency and OSS boundaries
        run: npm run oss:policy
