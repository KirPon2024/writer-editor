name: OSS policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1a-hermetic:
    uses: ./.github/workflows/r24-c1a-hermetic.yml

  inventory-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reject admission identity and complete output-set drift before heavy gates
        run: node --test test/contracts/r24-admission-preparation.contract.test.mjs test/contracts/r24-p01-admission-preparation-compatibility.contract.test.mjs test/contracts/r24-stage-admission-verifier-v2.contract.test.mjs
      - name: Reject stale context caches and handoff overwrite before heavy gates
        run: node --test test/contracts/agent-context-restoration.contract.test.mjs test/contracts/r24-p03-context-restoration-compatibility.contract.test.mjs
      - run: npm ci --engine-strict
      - name: Verify literal exhaustive inventory command
        run: npm run r24:test-inventory
      - name: Falsify inventory boundaries
        run: node --test test/contracts/r24-c1b-test-inventory.contract.test.mjs
      - name: Run broad maintained baseline
        env:
          GOVERNANCE_CHANGE_APPROVALS_PATH: docs/OPS/R24/CORRECTIVE/WP800_GOVERNANCE_CHANGE_APPROVALS_V1.json
        run: npm test
      - name: Verify WP-500 association scope semantics and mutants
        run: node --test test/unit/r24-wp500-associations.test.js test/unit/r24-wp500-associations-integration.test.js test/unit/r24-wp500-associations-mutants.test.js
      - name: Verify WP-501 triple-time knowledge semantics and mutants
        run: node --test test/unit/r24-wp501-time-knowledge.test.js test/unit/r24-wp501-time-knowledge-integration.test.js test/unit/r24-wp501-time-knowledge-mutants.test.js
      - name: Verify WP-502 promise-thread open-world causality semantics and mutants
        run: node --test test/unit/r24-wp502-threads-causality.test.js test/unit/r24-wp502-threads-causality-integration.test.js test/unit/r24-wp502-threads-causality-mutants.test.js test/contracts/r24-wp502-terminal-carriers.contract.test.mjs
      - name: Verify WP-503 Atlas posture and graph list table parity semantics and mutants
        run: npm run test:r24-wp503
      - name: Verify WP-504 dossier evidence, stable LOD and typed deep-link semantics and mutants
        run: npm run test:r24-wp504
      - name: Verify WP-505 register and bounded Query IR semantics and mutants
        run: node --test test/unit/r24-wp505-register-ask.test.js test/unit/r24-wp505-register-ask-integration.test.js test/unit/r24-wp505-register-ask-mutants.test.js test/contracts/r24-wp505-terminal-carriers.contract.test.mjs test/contracts/r24-wp505-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-506 disposable counterfactual and semantic impact semantics and mutants
        run: node --test test/unit/r24-wp506-counterfactual.test.js test/unit/r24-wp506-counterfactual-integration.test.js test/unit/r24-wp506-counterfactual-mutants.test.js test/contracts/r24-wp506-terminal-carriers.contract.test.mjs test/contracts/r24-wp506-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-700 versioned interchange IR capability and fidelity semantics and mutants
        run: node --test test/unit/r24-wp700-interchange-ir.test.js test/unit/r24-wp700-interchange-ir-integration.test.js test/unit/r24-wp700-interchange-ir-mutants.test.js test/contracts/r24-wp700-terminal-carriers.contract.test.mjs test/contracts/r24-wp700-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-507 Atlas product claim semantics, owner-gate successor and mutants
        run: node --test test/unit/r24-wp507-atlas-product-claim.test.js test/unit/r24-wp507-atlas-product-claim-integration.test.js test/unit/r24-wp507-atlas-product-claim-mutants.test.js test/contracts/r24-wp507-terminal-carriers.contract.test.mjs test/contracts/r24-wp507-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-701 archive XML and OOXML parser quarantine semantics and mutants
        run: node --test test/unit/r24-wp701-parser-quarantine.test.js test/unit/r24-wp701-parser-quarantine-integration.test.js test/unit/r24-wp701-parser-quarantine-mutants.test.js test/contracts/r24-wp701-terminal-carriers.contract.test.mjs test/contracts/r24-wp701-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-702 bounded TXT and Markdown semantics and mutants
        run: node --test test/unit/r24-wp702-text-formats.test.js test/unit/r24-wp702-text-formats-integration.test.js test/unit/r24-wp702-text-formats-mutants.test.js test/contracts/r24-wp702-terminal-carriers.contract.test.mjs test/contracts/r24-wp702-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-600 frozen FeatureSpec typed Query IR and real implementation mutants
        run: node --test test/unit/r24-wp600-featurespec-query-ir.test.js test/unit/r24-wp600-featurespec-query-ir-integration.test.js test/unit/r24-wp600-featurespec-query-ir-mutants.test.js test/contracts/r24-wp600-terminal-carriers.contract.test.mjs test/contracts/r24-wp600-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-703 corrected scope, DOCX semantic readback and implementation mutants
        run: node --test test/unit/r24-wp703-docx-profile.test.js test/unit/r24-wp703-docx-profile-integration.test.js test/unit/r24-wp703-docx-profile-mutants.test.js test/contracts/r24-wp703-terminal-carriers.contract.test.mjs test/contracts/r24-wp703-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-601 bounded local automation, replay and executable mutants
        run: node --test test/unit/r24-wp601-local-automation.test.js test/unit/r24-wp601-local-automation-integration.test.js test/unit/r24-wp601-local-automation-mutants.test.js test/contracts/r24-wp601-terminal-carriers.contract.test.mjs test/contracts/r24-wp601-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-601 exact historical inventory bindings without current-byte claims
        run: node --test test/contracts/r24-wp601-historical-inventory-claims.contract.test.mjs

      - name: Verify WP-704 PDF archive and Review Packet semantics, byte replay and hostile mutants
        run: node --test test/unit/r24-wp704-pdf-archive-review.test.js test/unit/r24-wp704-pdf-archive-review-integration.test.js test/unit/r24-wp704-pdf-archive-review-mutants.test.js test/contracts/r24-wp704-terminal-carriers.contract.test.mjs test/contracts/r24-wp704-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-705 exact schema negotiation, loss-accounted downgrade and corrected admission
        run: node --test test/unit/r24-wp705-negotiation-corpus.test.js test/unit/r24-wp705-negotiation-corpus-integration.test.js test/unit/r24-wp705-negotiation-corpus-mutants.test.js test/contracts/r24-wp705-terminal-carriers.contract.test.mjs test/contracts/r24-wp705-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-705 exact historical inventory pins and hostile non-coverage cases
        run: node --test test/contracts/r24-wp705-historical-inventory-claims.contract.test.mjs test/contracts/r24-wp601-historical-inventory-claims.contract.test.mjs
      - name: Verify WP-602 explicit proposal review, command handoff, rollback and executable mutants
        run: node --test test/unit/r24-wp602-proposal-workflow.test.js test/unit/r24-wp602-proposal-workflow-integration.test.js test/unit/r24-wp602-proposal-workflow-mutants.test.js test/contracts/r24-wp602-terminal-carriers.contract.test.mjs test/contracts/r24-wp602-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-603 source-first state and evidence views, bounded UI projection and executable mutants
        run: node --test test/unit/r24-wp603-wse-state-evidence.test.js test/unit/r24-wp603-wse-state-evidence-integration.test.js test/unit/r24-wp603-wse-state-evidence-mutants.test.js test/unit/r24-wp603-wse-state-evidence-ui-e2e-smoke.mjs test/contracts/r24-wp603-terminal-carriers.contract.test.mjs test/contracts/r24-wp603-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-604 evidence-bound story threads, open-world explanations and UI parity
        run: node --test test/unit/r24-wp604-wse-threads-explanation.test.js test/unit/r24-wp604-wse-threads-explanation-integration.test.js test/unit/r24-wp604-wse-threads-explanation-mutants.test.js test/unit/r24-wp604-wse-threads-explanation-ui-e2e-smoke.mjs test/contracts/r24-wp604-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-605 revision, story-time and object-custody read-only semantics
        run: node --test test/unit/r24-wp605-wse-revision-time-object.test.js test/unit/r24-wp605-wse-revision-time-object-integration.test.js test/unit/r24-wp605-wse-revision-time-object-mutants.test.js test/unit/r24-wp605-wse-revision-time-object-ui-e2e-smoke.mjs test/contracts/r24-wp605-terminal-carriers.contract.test.mjs test/contracts/r24-wp605-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-710 evidence capsule metadata export and physical roundtrip
        run: node --test test/unit/r24-wp710-evidence-capsule-export.test.js test/unit/r24-wp710-evidence-capsule-export-integration.test.js test/unit/r24-wp710-evidence-capsule-export-mutants.test.js test/contracts/r24-wp710-terminal-carriers.contract.test.mjs test/contracts/r24-wp710-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-606 series canon multi-layer Atlas evidence and agent context privacy
        run: node --test test/unit/r24-wp606-wse-series-multi-layer.test.js test/unit/r24-wp606-wse-series-multi-layer-integration.test.js test/unit/r24-wp606-wse-series-multi-layer-mutants.test.js test/unit/r24-wp606-wse-series-multi-layer-ui-e2e-smoke.mjs test/contracts/r24-wp606-terminal-carriers.contract.test.mjs test/contracts/r24-wp606-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-607 WSE claim verdicts, abstention and hard limits
        run: node --test test/unit/r24-wp607-wse-claims.test.js test/unit/r24-wp607-wse-claims-integration.test.js test/unit/r24-wp607-wse-claims-mutants.test.js test/unit/r24-wp607-wse-claims-ui-e2e-smoke.mjs test/contracts/r24-wp607-terminal-carriers.contract.test.mjs test/contracts/r24-wp607-post-audit-compatibility.contract.test.mjs
      - name: Verify WP-800 local aggregate Pulse privacy policy and strict receipt codec
        run: node --test test/unit/r24-wp800-pulse-policy-codec.test.js test/unit/r24-wp800-pulse-policy-codec-integration.test.js test/unit/r24-wp800-pulse-policy-codec-mutants.test.js test/contracts/r24-wp800-terminal-carriers.contract.test.mjs test/contracts/r24-wp800-post-audit-compatibility.contract.test.mjs

  e0-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run test:r24-e0

  actual-renderer-build-rtk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --engine-strict
      - name: Build the actual shipped renderer and preload artifacts
        run: npm run build:renderer
      - name: Require build-to-clean-tree policy
        run: git diff --exit-code -- src/renderer/editor.bundle.js src/preload.bundle.cjs
      - name: Run focused post-audit negative contracts after real build
        run: |
          npm run test:r24-post-audit
          node --test test/contracts/r24-post-audit-certification-set.contract.test.mjs test/contracts/r24-protected-wip-snapshot.contract.test.mjs test/contracts/r24-wp604-post-audit-compatibility.contract.test.mjs test/contracts/r24-wp605-post-audit-compatibility.contract.test.mjs test/contracts/r24-wp710-post-audit-compatibility.contract.test.mjs test/contracts/r24-wp606-post-audit-compatibility.contract.test.mjs test/contracts/r24-wp607-post-audit-compatibility.contract.test.mjs test/contracts/r24-wp800-post-audit-compatibility.contract.test.mjs
      - name: Run full maintained RTK after real build
        run: npm run test:rtk

  ops-vector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --engine-strict
      - run: node scripts/ops/r24/corrective/post-audit-corrections.mjs --check-static
      - run: node scripts/ops/r24/corrective/audit-r2-corrections.mjs --check
      - env:
          EFFECTIVE_MODE: STRICT
          GOVERNANCE_CHANGE_APPROVALS_PATH: docs/OPS/R24/CORRECTIVE/WP800_GOVERNANCE_CHANGE_APPROVALS_V1.json
        run: node scripts/ops/governance-change-detection.mjs --json --base-ref origin/main --approvals-path docs/OPS/R24/CORRECTIVE/WP800_GOVERNANCE_CHANGE_APPROVALS_V1.json

  oss-policy-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/check-no-paid-tiptap.mjs
      - run: npm ci --engine-strict
      - run: node scripts/check-no-paid-tiptap.mjs
      - run: npm audit --omit=dev --audit-level=high

  privacy-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --engine-strict
      - name: Configure the Electron SUID sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c '%u:%g:%a' node_modules/electron/dist/chrome-sandbox)" = "0:0:4755"
      - name: Explicit privacy-negative gate
        run: xvfb-run -a node --test test/contracts/b3c08-support-bundle-privacy.contract.test.js test/unit/security-privacy-writing-path-smoke.mjs

      - name: Verify WP-704 actual offline Electron PDF render and repeated canonical bytes
        run: node scripts/ops/r24/wp704-physical-pdf.cjs --driver

  static-security-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact SAST tool
        run: python -m pip install --disable-pip-version-check semgrep==1.175.0
      - name: Run generic SAST fail-closed
        run: node semgrep-generic-sast.mjs

  rtk-required:
    uses: ./.github/workflows/rtk-required.yml

  x1-runtime-parity:
    uses: ./.github/workflows/x1-runtime-parity.yml

  live-ruleset-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require literal protected merge-gate ruleset without bypass or protection loss
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/r24/corrective/post-audit-merge-gate.mjs --check-live-ruleset

  merge-gate:
    name: merge-gate
    if: ${{ always() }}
    needs:
      - actual-renderer-build-rtk
      - c1a-hermetic
      - e0-mutants
      - inventory-baseline
      - live-ruleset-oracle
      - ops-vector
      - oss-policy-core
      - privacy-negative
      - rtk-required
      - static-security-sast
      - x1-runtime-parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRED_DEPENDENCY_RESULTS: >-
        {"actual-renderer-build-rtk":"${{ needs.actual-renderer-build-rtk.result }}","c1a-hermetic":"${{ needs.c1a-hermetic.result }}","e0-mutants":"${{ needs.e0-mutants.result }}","inventory-baseline":"${{ needs.inventory-baseline.result }}","live-ruleset-oracle":"${{ needs.live-ruleset-oracle.result }}","ops-vector":"${{ needs.ops-vector.result }}","oss-policy-core":"${{ needs.oss-policy-core.result }}","privacy-negative":"${{ needs.privacy-negative.result }}","rtk-required":"${{ needs.rtk-required.result }}","static-security-sast":"${{ needs.static-security-sast.result }}","x1-runtime-parity":"${{ needs.x1-runtime-parity.result }}"}
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on failed cancelled or unexplained skipped dependencies
        run: node scripts/ops/r24/corrective/post-audit-merge-gate.mjs --check-results "$REQUIRED_DEPENDENCY_RESULTS"

  oss-policy:
    name: oss-policy
    if: ${{ always() }}
    needs:
      - merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compatibility context during protected ruleset transition
        env:
          MERGE_GATE_RESULT: ${{ needs.merge-gate.result }}
        run: test "$MERGE_GATE_RESULT" = success
