name: lockfile-node22

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package-lock.json
      - package.json
      - .node-version

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact runtime
        run: |
          test "$(node --version)" = "v22.12.0"
          test "$(npm --version)" = "10.9.0"
      - name: Verify lockfile by exact engine-strict install
        run: npm ci --engine-strict
      - name: Require lockfile stability
        run: git diff --exit-code -- package-lock.json package.json .node-version
