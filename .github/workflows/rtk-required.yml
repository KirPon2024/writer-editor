name: rtk-required

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rtk-required:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run maintained RTK graph
        run: npm run -s test:rtk

      - name: Run maintained Atlas event contract graph
        run: npm run -s test:atlas-event-contract

      - name: Run maintained Atlas release truth graph
        run: npm run -s test:atlas-release-truth

      - name: Run Atlas V6 production negative matrix
        run: npm run -s test:atlas-v6-production
