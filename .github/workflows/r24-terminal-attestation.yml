name: r24-terminal-attestation

on:
  workflow_dispatch:
    inputs:
      stage_id:
        required: true
        type: string
      stage_instance_path:
        required: true
        type: string
      stage_admission_path:
        required: true
        type: string
      program_path:
        required: true
        type: string
      trust_path:
        required: true
        type: string
      effective_state_path:
        required: true
        type: string
      implementation_candidate_sha:
        required: true
        type: string
      implementation_merge_sha:
        required: true
        type: string
      evaluation_sha:
        required: true
        type: string
      evaluation_tree_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  terminal-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evaluation_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --engine-strict
      - name: Verify exact stage route identities ancestry and direct closure authority
        shell: bash
        env:
          STAGE_ID: ${{ inputs.stage_id }}
          STAGE_INSTANCE_PATH: ${{ inputs.stage_instance_path }}
          STAGE_ADMISSION_PATH: ${{ inputs.stage_admission_path }}
          PROGRAM_PATH: ${{ inputs.program_path }}
          TRUST_PATH: ${{ inputs.trust_path }}
          EFFECTIVE_STATE_PATH: ${{ inputs.effective_state_path }}
          IMPLEMENTATION_CANDIDATE_SHA: ${{ inputs.implementation_candidate_sha }}
          IMPLEMENTATION_MERGE_SHA: ${{ inputs.implementation_merge_sha }}
          EVALUATION_SHA: ${{ inputs.evaluation_sha }}
          EVALUATION_TREE_SHA: ${{ inputs.evaluation_tree_sha }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit 1; }
          test "$STAGE_ID" = POST_AUDIT_CORRECTIONS || fail E_STAGE_IDENTITY
          test "$STAGE_INSTANCE_PATH" = docs/OPS/R24/CORRECTIVE/POST_AUDIT_CORRECTIONS_STAGE_INSTANCE_V9.json || fail E_STAGE_PATH_IDENTITY
          test "$STAGE_ADMISSION_PATH" = docs/OPS/R24/CORRECTIVE/POST_AUDIT_CORRECTIONS_STAGE_ADMISSION_ATTESTATION_V9.json || fail E_STAGE_PATH_IDENTITY
          test "$PROGRAM_PATH" = docs/OPS/R24/CORRECTIVE/R24_CORRECTIVE_PROGRAM_V1_1.json || fail E_PROGRAM_PATH_IDENTITY
          test "$TRUST_PATH" = docs/OPS/R24/CORRECTIVE/POST_AUDIT_TERMINAL_TRUST_MODEL_V1.json || fail E_TRUST_PATH_IDENTITY
          test "$EFFECTIVE_STATE_PATH" = docs/OPS/R24/CORRECTIVE/POST_AUDIT_CORRECTIONS_EFFECTIVE_STATE_V1.json || fail E_EFFECTIVE_STATE_PATH_IDENTITY
          test "$GITHUB_SHA" = "$EVALUATION_SHA" || fail E_EVALUATION_CHECKOUT
          test "$(git rev-parse "$EVALUATION_SHA^{tree}")" = "$EVALUATION_TREE_SHA" || fail E_EVALUATION_TREE
          git cat-file -e "$IMPLEMENTATION_CANDIDATE_SHA^{commit}"
          git cat-file -e "$IMPLEMENTATION_MERGE_SHA^{commit}"
          git merge-base --is-ancestor "$IMPLEMENTATION_CANDIDATE_SHA" "$IMPLEMENTATION_MERGE_SHA" || fail E_CANDIDATE_MERGE_ANCESTRY
          git merge-base --is-ancestor "$IMPLEMENTATION_MERGE_SHA" "$EVALUATION_SHA" || fail E_MERGE_EVALUATION_ANCESTRY
          test "$(git rev-parse "$IMPLEMENTATION_MERGE_SHA^2")" = "$IMPLEMENTATION_CANDIDATE_SHA" || fail E_CANDIDATE_SECOND_PARENT
          export OUT="$RUNNER_TEMP/r24-terminal-attestation"
          mkdir -p "$OUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const h=(b)=>crypto.createHash('sha256').update(b).digest('hex');
          const c=(v)=>Array.isArray(v)?`[${v.map(c).join(',')}]`:v&&typeof v==='object'?`{${Object.keys(v).sort().map(k=>`${JSON.stringify(k)}:${c(v[k])}`).join(',')}}`:JSON.stringify(v);
          const bytes=(p)=>fs.readFileSync(p);
          const json=(p)=>JSON.parse(bytes(p));
          const instanceBytes=bytes(process.env.STAGE_INSTANCE_PATH), admissionBytes=bytes(process.env.STAGE_ADMISSION_PATH), programBytes=bytes(process.env.PROGRAM_PATH), trustBytes=bytes(process.env.TRUST_PATH), effectiveBytes=bytes(process.env.EFFECTIVE_STATE_PATH);
          const instance=JSON.parse(instanceBytes), admission=JSON.parse(admissionBytes), trust=JSON.parse(trustBytes), effective=JSON.parse(effectiveBytes);
          const closureInstanceBytes=bytes('docs/OPS/R24/CORRECTIVE/WP400_TERMINAL_CLOSURE_STAGE_INSTANCE_V1.json');
          const closureAdmissionBytes=bytes('docs/OPS/R24/CORRECTIVE/WP400_TERMINAL_CLOSURE_STAGE_ADMISSION_ATTESTATION_V1.json');
          const closureStateBytes=bytes('docs/OPS/R24/CORRECTIVE/WP400_TERMINAL_CLOSURE_EFFECTIVE_STATE_V1.json');
          const closureReceiptBytes=bytes('docs/OPS/R24/EVIDENCE/ES-R24-WP-400-ANCHOR-LINEAGE-POSTMERGE-EXACT-HEAD.json');
          const issuerInstanceBytes=bytes('docs/OPS/R24/CORRECTIVE/WP400_TERMINAL_ISSUER_COMPATIBILITY_STAGE_INSTANCE_V1.json');
          const issuerAdmissionBytes=bytes('docs/OPS/R24/CORRECTIVE/WP400_TERMINAL_ISSUER_COMPATIBILITY_STAGE_ADMISSION_ATTESTATION_V1.json');
          const assert=(ok,code)=>{if(!ok)throw new Error(code)};
          assert(instance.stageId===process.env.STAGE_ID && admission.stageId===process.env.STAGE_ID,'E_STAGE_BINDING');
          assert(admission.stageInstanceDigest===h(instanceBytes) && admission.status==='ADMITTED','E_ADMISSION_BINDING');
          assert(effective.stageInstanceDigest===h(instanceBytes) && effective.stageAdmissionDigest===h(admissionBytes),'E_EFFECTIVE_STATE_BINDING');
          assert(trust.programDigest===h(programBytes) && trust.stageInstanceDigest===h(instanceBytes) && trust.stageAdmissionDigest===h(admissionBytes),'E_TRUST_BINDING');
          assert(trust.predecessors.wp400Closure.stageInstanceDigest===h(closureInstanceBytes),'E_CLOSURE_INSTANCE_PREDECESSOR');
          assert(trust.predecessors.wp400Closure.stageAdmissionDigest===h(closureAdmissionBytes),'E_CLOSURE_ADMISSION_PREDECESSOR');
          assert(trust.predecessors.wp400Closure.effectiveStateDigest===h(closureStateBytes),'E_CLOSURE_STATE_PREDECESSOR');
          assert(trust.predecessors.wp400Closure.receiptDigest===h(closureReceiptBytes),'E_CLOSURE_RECEIPT_PREDECESSOR');
          assert(trust.predecessors.issuerCompatibility.stageInstanceDigest===h(issuerInstanceBytes),'E_ISSUER_INSTANCE_PREDECESSOR');
          assert(trust.predecessors.issuerCompatibility.stageAdmissionDigest===h(issuerAdmissionBytes),'E_ISSUER_ADMISSION_PREDECESSOR');
          const attestation={
            schemaVersion:'TERMINAL_ATTESTATION_V2',attestationType:'EXTERNAL_IMMUTABLE_TERMINAL_ATTESTATION',result:'PASS',stageId:instance.stageId,
            programDigest:h(programBytes),trustModelDigest:h(trustBytes),stageInstanceDigest:h(instanceBytes),stageAdmissionDigest:h(admissionBytes),
            writeSetDigest:admission.writeSetDigest,commandScopeDigest:admission.commandScopeDigest,acceptanceSignalsDigest:admission.acceptanceSignalsDigest,effectiveStateDigest:h(effectiveBytes),
            predecessors:{issuerCompatibility:{stageInstanceDigest:h(issuerInstanceBytes),stageAdmissionDigest:h(issuerAdmissionBytes)},wp400Closure:{stageInstanceDigest:h(closureInstanceBytes),stageAdmissionDigest:h(closureAdmissionBytes),effectiveStateDigest:h(closureStateBytes),receiptDigest:h(closureReceiptBytes)}},
            implementationCandidateSha:process.env.IMPLEMENTATION_CANDIDATE_SHA,implementationMergeSha:process.env.IMPLEMENTATION_MERGE_SHA,evaluationSha:process.env.EVALUATION_SHA,evaluationTreeSha:process.env.EVALUATION_TREE_SHA,
            repository:process.env.GITHUB_REPOSITORY,workflowPath:'.github/workflows/r24-terminal-attestation.yml',workflowRunId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),event:process.env.GITHUB_EVENT_NAME,ref:process.env.GITHUB_REF,
            artifactName:`r24-terminal-attestation-${instance.stageId}`,artifactFile:'terminal-attestation.json',programDoneClaimed:false
          };
          fs.writeFileSync(`${process.env.OUT}/terminal-attestation.json`,`${c(attestation)}\n`);
          NODE
      - name: Require exactly one canonical artifact member
        shell: bash
        run: |
          test "$(find "$RUNNER_TEMP/r24-terminal-attestation" -type f | wc -l | tr -d ' ')" = 1
          test -f "$RUNNER_TEMP/r24-terminal-attestation/terminal-attestation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: r24-terminal-attestation-${{ inputs.stage_id }}
          path: ${{ runner.temp }}/r24-terminal-attestation/terminal-attestation.json
          if-no-files-found: error
          retention-days: 90
